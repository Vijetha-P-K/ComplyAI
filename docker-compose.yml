services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: complyai
      POSTGRES_PASSWORD: complyai
      POSTGRES_DB: complyai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complyai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://complyai:complyai@db:5432/complyai
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      UPLOAD_DIR: /data/uploads
      CHROMA_DIR: /data/chroma
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  appdata:
